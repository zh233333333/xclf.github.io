<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F7FA">
<title>测一测｜你是《小城良方》里的谁</title>
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@500;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
:root{
  --bg:#F2F7FA;
  --ink:#15202B;
  --ink2:#5C6B78;
  --ink3:#93A0AA;
  --line:#DCE8EE;
  --night:#0E1A27;
  --ice:#7FC3DB;
  --ice-deep:#4E93B8;
  --gold:#E9B45C;
  --coral:#D9695F;
  --paper:#FFFFFF;
  --serif:'Noto Serif SC',"Songti SC",Georgia,serif;
  --sans:'Noto Sans SC',-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
  -webkit-font-smoothing:antialiased;touch-action:manipulation;overflow-x:hidden;
}
/* ===== 背景：雪与小城灯 ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg::before{
  content:"";position:absolute;inset:0;
  background:
    radial-gradient(60vmax 60vmax at -10% -15%,#CFE6F1 0%,#CFE6F100 65%),
    radial-gradient(50vmax 50vmax at 110% 0%,#FBE7CE 0%,#FBE7CE00 60%),
    radial-gradient(55vmax 55vmax at 30% 115%,#E3E1F1 0%,#E3E1F100 62%);
  opacity:.75;
}
.snow-field{position:absolute;inset:0;overflow:hidden}
.flake{position:absolute;top:-10vh;border-radius:50%;background:#fff;opacity:.9;animation:fall linear infinite;filter:blur(.2px)}
@keyframes fall{to{transform:translate3d(var(--dx,0),120vh,0)}}

/* ===== 视图 ===== */
.view{display:none;position:relative;z-index:1;min-height:100dvh;padding:clamp(20px,5vw,52px) clamp(18px,4.8vw,40px)}
.view.active{display:flex;flex-direction:column}
@keyframes viewIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.view.active{animation:viewIn .55s cubic-bezier(.2,.8,.2,1) both}

/* ===== 首页 ===== */
#home{justify-content:center}
.home{width:100%;max-width:640px;margin:auto}
.sign{
  position:relative;border-radius:30px;padding:clamp(26px,6.4vw,44px) clamp(20px,5.4vw,38px);
  background:linear-gradient(170deg,#132232 0%,#0C1721 70%,#0A141D 100%);
  border:1px solid #2C4658;
  box-shadow:0 34px 70px -40px rgba(10,22,32,.9),inset 0 1px 0 rgba(255,255,255,.08);
  overflow:hidden;
}
.sign::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:46%;
  background:radial-gradient(60% 100% at 50% 100%,rgba(127,195,219,.18),transparent 70%);
  pointer-events:none;
}
.sign .tiny{position:relative;z-index:1;display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.16em;color:#8FB6C9}
.sign .tiny::before{content:"";width:22px;height:1px;background:#5E8DA3}
.sign h1{position:relative;z-index:1;margin:clamp(18px,4.4vw,26px) 0 0;font-family:var(--serif);font-weight:500}
.sign h1 .l1{display:block;font-size:clamp(15px,3.7vw,18px);letter-spacing:.2em;color:#AFC6D4;margin-bottom:14px}
.sign h1 .l2{display:block;font-size:clamp(30px,8.4vw,50px);line-height:1.3;letter-spacing:.02em;color:#FFEFCF;text-shadow:0 0 20px rgba(233,180,92,.45),0 0 46px rgba(233,180,92,.22)}
.sign h1 .l2 em{font-style:normal;color:#F7D692;border-bottom:2px solid rgba(233,180,92,.45);padding-bottom:2px}
.lede{position:relative;z-index:1;margin:clamp(16px,4.2vw,22px) 0 0;font-size:clamp(13.5px,3.7vw,15px);line-height:1.95;color:#9EB6C4;font-weight:300}
.shops{position:relative;z-index:1;display:flex;flex-wrap:wrap;gap:8px;margin-top:clamp(18px,4.6vw,24px)}
.shops span{
  font-size:11.5px;letter-spacing:.06em;padding:5px 10px;border-radius:7px;
  border:1px solid rgba(127,195,219,.34);color:#A9CBD9;background:rgba(127,195,219,.07);
  box-shadow:0 0 12px rgba(127,195,219,.12);
}
.shops span:nth-child(2){border-color:rgba(233,180,92,.4);color:#E9C48B;background:rgba(233,180,92,.08);box-shadow:0 0 12px rgba(233,180,92,.14)}
.start{
  position:relative;z-index:1;margin-top:clamp(26px,6vw,34px);width:100%;
  appearance:none;cursor:pointer;border-radius:999px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:clamp(14px,3.8vw,17px);
  font-family:var(--sans);font-size:clamp(15px,4vw,17px);font-weight:500;letter-spacing:.1em;
  color:#0E1A27;background:linear-gradient(180deg,#FFEBC4,#EDBC6B);
  border:1px solid #FFE6B8;
  box-shadow:0 16px 34px -18px rgba(233,180,92,.85),inset 0 1px 0 #FFF7E2;
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,filter .25s;
}
.start:hover{transform:translateY(-2px);filter:brightness(1.04);box-shadow:0 20px 40px -16px rgba(233,180,92,.9)}
.start:active{transform:scale(.975)}
.home-note{margin:20px 0 0;text-align:center;font-size:12px;color:#7C8C99;letter-spacing:.02em}
.home-foot{margin-top:auto;padding-top:24px;text-align:center;font-size:11.5px;color:#8D9BA6}

/* ===== 答题页 ===== */
.q-head{width:100%;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:13px}
.back{
  flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);
  background:#ffffffcc;color:var(--ink2);font-size:15px;cursor:pointer;display:grid;place-items:center;
  transition:background .2s,transform .2s,opacity .2s;
}
.back:hover{background:#fff;color:var(--ink)}
.back:active{transform:scale(.94)}
.back:disabled{opacity:.3;cursor:default}
.q-track{flex:1 1 auto;height:5px;background:#E2EDF2;border-radius:999px;overflow:hidden}
.q-track i{display:block;height:100%;width:4%;border-radius:999px;background:linear-gradient(90deg,#9FD3E4,#5FA8C4 55%,#E9B45C);transition:width .42s cubic-bezier(.25,.9,.3,1)}
.q-count{flex:0 0 auto;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.q-count b{color:var(--ink);font-weight:500;font-size:15px}
.q-stage{width:100%;max-width:640px;margin:clamp(22px,5.4vw,40px) auto 0;flex:1 1 auto}
.q-card{animation:qIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes qIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.q-chip{display:inline-block;font-size:11px;letter-spacing:.18em;color:#69808F;border:1px solid var(--line);background:#ffffffd9;border-radius:999px;padding:4px 11px}
.q-title{
  font-family:var(--serif);font-weight:500;font-size:clamp(19px,5.2vw,25px);line-height:1.65;
  letter-spacing:.01em;margin:14px 0 clamp(18px,4.4vw,24px);text-wrap:balance;
}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  position:relative;display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  cursor:pointer;appearance:none;background:var(--paper);border:1px solid var(--line);
  border-radius:16px;padding:14px 42px 14px 14px;
  font-family:var(--sans);font-size:clamp(14px,3.9vw,15.5px);line-height:1.55;color:var(--ink);
  transition:border-color .2s,background .2s,transform .18s,box-shadow .2s;
  box-shadow:0 1px 0 #0E1A2705;
}
.opt .key{flex:0 0 auto;width:25px;height:25px;border-radius:8px;background:#EDF3F6;display:grid;place-items:center;font-size:11.5px;font-weight:600;color:#7C909D;transition:background .2s,color .2s}
.opt .tick{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;border-radius:50%;
  background:var(--ice-deep);color:#fff;display:grid;place-items:center;font-size:11px;opacity:0;transition:opacity .2s;
}
@media (hover:hover){
  .opt:hover{border-color:#BFD8E3;background:#FCFEFF;transform:translateY(-1px);box-shadow:0 12px 24px -20px rgba(14,26,39,.55)}
  .opt:hover .key{background:#E2EEF3}
}
.opt:active{transform:scale(.985)}
.opt.done{border-color:#68AFCC;background:#F6FCFE;box-shadow:0 12px 26px -20px rgba(78,147,184,.55)}
.opt.done .key{background:#68AFCC;color:#fff}
.opt.done .tick{opacity:1}
.q-tip{margin:14px 2px 0;font-size:11.5px;color:var(--ink3)}
.q-foot{margin-top:auto;padding-top:20px;text-align:center;font-size:11.5px;color:var(--ink3)}

/* 计算中 */
.computing{position:fixed;inset:0;z-index:9;display:none;place-items:center;background:#F2F7FAf2;backdrop-filter:blur(6px)}
.computing.show{display:grid;animation:viewIn .35s both}
.computing .inner{text-align:center}
.dots{display:flex;gap:7px;justify-content:center;margin-bottom:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--ice-deep);animation:pulse 1.1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s;background:var(--gold)}
.dots i:nth-child(3){animation-delay:.36s;background:var(--coral)}
@keyframes pulse{0%,100%{transform:scale(.6);opacity:.45}50%{transform:scale(1);opacity:1}}
.computing p{margin:0;font-family:var(--serif);font-size:15px;color:var(--ink2);letter-spacing:.04em}

/* ===== 结果页 ===== */
#result{padding-top:clamp(18px,4.4vw,40px);padding-bottom:clamp(24px,6vw,44px)}
.res-wrap{width:100%;max-width:640px;margin:0 auto}
.res-hero{
  position:relative;border-radius:28px;padding:clamp(22px,5.4vw,32px);overflow:hidden;
  background:linear-gradient(168deg,#142433 0%,#0C1721 72%,#0A141D 100%);
  border:1px solid #2B4557;
  box-shadow:0 30px 60px -40px rgba(10,22,32,.9);
  animation:viewIn .55s both;
}
.res-hero::after{
  content:"";position:absolute;inset:auto -20% -40% -20%;height:70%;
  background:radial-gradient(50% 100% at 50% 100%,color-mix(in srgb,var(--acc) 24%,transparent),transparent 72%);
  pointer-events:none;
}
.res-eyebrow{margin:0;position:relative;z-index:1;font-size:11px;letter-spacing:.22em;color:#7FA0B3}
.res-name{
  position:relative;z-index:1;margin:12px 0 4px;font-family:var(--serif);font-weight:700;
  font-size:clamp(32px,9vw,50px);line-height:1.22;letter-spacing:.04em;color:var(--acc);
  text-shadow:0 0 22px color-mix(in srgb,var(--acc) 42%,transparent);
}
.res-sub{position:relative;z-index:1;margin:0;font-size:clamp(13px,3.7vw,15px);color:#C6D6E0;letter-spacing:.02em}
.res-actor{position:relative;z-index:1;margin:7px 0 0;font-size:12px;color:#8AA3B3}
.slogan{
  position:relative;z-index:1;margin:clamp(16px,4.4vw,22px) 0 0;display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;
}
.slogan p{margin:0;flex:1 1 auto;font-family:var(--serif);font-size:clamp(14.5px,4vw,17px);line-height:1.62;color:#FFEFCF}
.copy-mini{
  flex:0 0 auto;appearance:none;border:1px solid rgba(255,255,255,.22);background:transparent;color:#B9CBD7;
  font-family:var(--sans);font-size:11.5px;padding:6px 11px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s;
}
.copy-mini:hover{background:rgba(255,255,255,.1);color:#fff}
.dims{position:relative;z-index:1;margin-top:clamp(18px,4.6vw,24px);padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.dims-title{margin:0 0 12px;font-size:11px;letter-spacing:.14em;color:#7FA0B3}
.dim-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.dim-row .n{flex:0 0 50px;font-size:11.5px;color:#9DB4C2}
.dim-row .track{flex:1 1 auto;height:4px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden}
.dim-row .track i{display:block;height:100%;border-radius:999px;background:#5E7E92}
.dim-row.top .track i{background:var(--acc)}
.dim-row.top .n{color:#E7F1F6}

.res-block{
  margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:22px;
  padding:clamp(18px,4.6vw,26px);box-shadow:0 16px 34px -34px rgba(14,26,39,.35);
  animation:viewIn .5s both;
}
.res-block:nth-of-type(2){animation-delay:.07s}
.res-block:nth-of-type(3){animation-delay:.14s}
.res-block:nth-of-type(4){animation-delay:.21s}
.res-block h3{margin:0 0 12px;font-size:12px;letter-spacing:.16em;color:var(--ink3);font-weight:500;display:flex;align-items:center;gap:8px}
.res-block h3::before{content:"";width:14px;height:2px;background:var(--acc);border-radius:2px}
.res-block p{margin:0 0 10px;font-size:clamp(14px,3.8vw,15px);line-height:1.88;color:#2C3841;font-weight:300}
.res-block p:last-child{margin-bottom:0}
.easter{margin-top:12px;background:#F8FBFD;border:1px solid #E4EEF2;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.78;color:var(--ink2);font-weight:300}
.easter b{color:var(--ice-deep);font-weight:500}
.scene{margin-top:12px;font-size:12px;color:#7E8F9B;line-height:1.8;border-left:2px solid #E2EDF2;padding-left:10px}

.res-actions{margin-top:clamp(18px,5vw,26px);display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1 1 140px;appearance:none;cursor:pointer;border-radius:999px;font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:.03em;padding:14px 18px;transition:transform .2s,background .2s,box-shadow .2s}
.btn.main{background:var(--night);color:#FFEFCF;border:1px solid var(--night);box-shadow:0 16px 30px -20px rgba(14,26,39,.85)}
.btn.main:hover{background:#0A141D;transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:#FBFDFE}
.btn:active{transform:scale(.98)}
.share-hint{margin-top:14px;text-align:center;font-size:12px;color:var(--ink3);line-height:1.8}

#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
  background:#15202B;color:#FFF6E6;font-size:13px;padding:10px 18px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;max-width:82vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:400px){
  .q-title{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .snow{display:none}
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true"><div class="snow-field" id="snow"></div></div>

<!-- ===== 首页 ===== -->
<section id="home" class="view active">
  <div class="home">
    <div class="sign">
      <span class="tiny">SMALL TOWN REMEDY · 人格小票</span>
      <h1>
        <span class="l1">测一测</span>
        <span class="l2">你是《小城良方》里的<em>谁</em></span>
      </h1>
      <p class="lede">
        30 道日常小题，不考剧情，也不用背人名。<br>
        就按你平时的第一反应选，看看你身上那股劲儿，<br>
        最像小西门里的哪一个人。
      </p>
      <div class="shops">
        <span>小西门医院</span><span>1314</span><span>烤红薯</span><span>雪夜 · 抚城</span>
      </div>
      <button class="start" id="startBtn">开始测试 →</button>
      <p class="home-note">没有标准答案 · 看过剧就能玩 · 30 题约 3 分钟</p>
    </div>
  </div>
  <div class="home-foot">测完记得截个图，发给朋友问一句“你是哪个”</div>
</section>

<!-- ===== 答题页 ===== -->
<section id="quiz" class="view">
  <div class="q-head">
    <button class="back" id="backBtn" aria-label="上一题">←</button>
    <div class="q-track"><i id="barFill"></i></div>
    <div class="q-count"><b id="qNow">01</b><span> / 30</span></div>
  </div>
  <div class="q-stage" id="qStage"></div>
  <div class="q-foot">凭第一感觉选，不必想太久</div>
</section>

<!-- ===== 结果页 ===== -->
<section id="result" class="view">
  <div class="res-wrap" id="resStage"></div>
</section>

<div class="computing" id="computing">
  <div class="inner">
    <div class="dots"><i></i><i></i><i></i></div>
    <p>正在小西门的老病历里，对号入座…</p>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
// ===== 七个性格维度 =====
const DIM_NAMES = {
  R:'理性克制', L:'掌局通透', A:'直球热忱', G:'乐天护短',
  C:'气氛链接', M:'双面奔赴', H:'沉底守望'
};

// ===== 30 道日常场景题（p 主倾向 +2，s 副倾向 +1）=====
const QUESTIONS = [
  {q:'下雪的第一天，你的第一反应——', o:[
    {t:'先看一眼路面，盘算出门要多留多久', p:'R', s:'L'},
    {t:'拍一张，发给不在这个城市的人', p:'G', s:'C'},
    {t:'约人吃顿热乎的，雪天最适合凑一桌', p:'C', s:'A'},
    {t:'站在窗边看一会儿，什么也不做', p:'H', s:'R'}
  ]},
  {q:'群里有人发一句“出事了”，你——', o:[
    {t:'先问清楚：谁、在哪、现在什么情况', p:'L', s:'R'},
    {t:'直接一句“我马上到”', p:'A', s:'C'},
    {t:'先稳住发消息的人：别急，慢慢说', p:'C', s:'A'},
    {t:'心里先过一遍最坏的情况', p:'R', s:'L'}
  ]},
  {q:'第一天到一个新地方上班——', o:[
    {t:'先把流程、规矩、谁能拍板弄清楚', p:'L', s:'R'},
    {t:'主动打招呼，先混个脸熟', p:'C', s:'A'},
    {t:'安静做事，用结果说话', p:'R', s:'M'},
    {t:'观察谁好说话、谁不能惹', p:'H', s:'L'}
  ]},
  {q:'有人当面夸你“你人真好”，你心里——', o:[
    {t:'有点不好意思，其实我没想那么多', p:'G', s:'A'},
    {t:'顺着接一句：那你得请我吃饭', p:'C', s:'A'},
    {t:'想一想，他为什么这么说', p:'L', s:'R'},
    {t:'笑笑，回头该干嘛干嘛', p:'H', s:'R'}
  ]},
  {q:'暖气开得很足的冬天，你在——', o:[
    {t:'把窗开条缝，屋里得有新鲜空气', p:'H', s:'R'},
    {t:'煮点热乎的，招呼人来吃', p:'C', s:'G'},
    {t:'裹着毯子刷剧，脚边一堆零食', p:'G', s:'H'},
    {t:'趁暖和把该办的事都办了', p:'M', s:'R'}
  ]},
  {q:'朋友半夜发“我睡不着”——', o:[
    {t:'回一句“那正好，聊十分钟”', p:'C', s:'A'},
    {t:'先问他最近是不是有什么事', p:'L', s:'R'},
    {t:'直接说“明早我给你带早饭”', p:'G', s:'A'},
    {t:'陪他熬着，不急着给建议', p:'H', s:'A'}
  ]},
  {q:'要做一个从没做过的决定——', o:[
    {t:'能查的都查一遍，列个表', p:'R', s:'L'},
    {t:'先做一小步试试水', p:'A', s:'M'},
    {t:'问三个最靠谱的人', p:'C', s:'L'},
    {t:'拖两天，直觉会告诉我', p:'G', s:'H'}
  ]},
  {q:'单位里有个特别能张罗的人——', o:[
    {t:'挺好，有人张罗我省心', p:'H', s:'C'},
    {t:'我配合，但关键的事得我说了算', p:'L', s:'R'},
    {t:'我也是那种人，我们能凑一桌', p:'C', s:'G'},

// ===== 状态 =====
const state = { idx:0, answers:new Array(QUESTIONS.length).fill(null), locked:false };
const $ = (s)=>document.querySelector(s);
const views = { home:$('#home'), quiz:$('#quiz'), result:$('#result') };

function showView(name){
  Object.values(views).forEach(v=>v.classList.remove('active'));
  views[name].classList.add('active');
  window.scrollTo(0,0);
}

// ===== 答题 =====
const LET = ['A','B','C','D'];

function renderQuestion(){
  const q = QUESTIONS[state.idx];
  const picked = state.answers[state.idx];
  const card = document.createElement('div');
  card.className = 'q-card';
  card.innerHTML = `
    <span class="q-chip">Q${String(state.idx+1).padStart(2,'0')}</span>
    <h2 class="q-title">${q.q}</h2>
    <div class="opts"></div>
    <p class="q-tip">没有标准答案，选最像你的那一个</p>
  `;
  const box = card.querySelector('.opts');
  q.o.forEach((op,i)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt' + (picked===i ? ' done' : '');
    b.dataset.i = i;
    b.innerHTML = `<span class="key">${LET[i]}</span><span class="txt">${op.t}</span><span class="tick">✓</span>`;
    b.addEventListener('click',(e)=>onPick(e,i,b));
    box.appendChild(b);
  });
  $('#qStage').replaceChildren(card);
  $('#qNow').textContent = String(state.idx+1).padStart(2,'0');
  const done = state.answers.filter(a=>a!==null).length;
  $('#barFill').style.width = Math.max(4, Math.round(done / QUESTIONS.length * 100)) + '%';
  $('#backBtn').disabled = state.idx === 0;
}

// 手机上滑动的误触不算选择
let ptDown = {x:0,y:0};
document.addEventListener('pointerdown',(e)=>{ ptDown.x = e.clientX; ptDown.y = e.clientY; },{passive:true});

function onPick(e, i, el){
  if(state.locked) return;
  if(Math.hypot((e.clientX||0)-ptDown.x, (e.clientY||0)-ptDown.y) > 12) return;

  state.answers[state.idx] = i;
  el.parentElement.querySelectorAll('.opt').forEach(o=>o.classList.remove('done'));
  el.classList.add('done');
  const done = state.answers.filter(a=>a!==null).length;
  $('#barFill').style.width = Math.max(4, Math.round(done / QUESTIONS.length * 100)) + '%';

  state.locked = true;
  setTimeout(()=>{
    if(state.idx < QUESTIONS.length - 1){
      state.idx++;
      renderQuestion();
      state.locked = false;
    }else{
      finish();
    }
  }, 290);
}

$('#startBtn').addEventListener('click',()=>{
  state.idx = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  state.locked = false;
  showView('quiz');
  renderQuestion();
});

$('#backBtn').addEventListener('click',()=>{
  if(state.locked || state.idx === 0) return;
  state.idx--;
  renderQuestion();
});

// ===== 计分 =====
function compute(){
  const score = {R:0,L:0,A:0,G:0,C:0,M:0,H:0};
  const avail = {R:0,L:0,A:0,G:0,C:0,M:0,H:0};

  QUESTIONS.forEach((q,qi)=>{
    const sel = state.answers[qi];
    q.o.forEach((op,oi)=>{
      const hit = oi === sel ? 1 : 0;
      score[op.p] += 2 * hit; avail[op.p] += 2;
      if(op.s){ score[op.s] += hit; avail[op.s] += 1; }
    });
  });

  // 用“得分 / 可得分”消除题目分布差异
  const rate = {};
  Object.keys(score).forEach(k=>{ rate[k] = score[k] / (avail[k] || 1); });
  const ranked = Object.keys(rate).sort((a,b)=> rate[b] - rate[a]);
  return { score, rate, ranked };
}

function finish(){
  $('#computing').classList.add('show');
  setTimeout(()=>{
    $('#computing').classList.remove('show');
    renderResult();
    state.locked = false;
  }, 950);
}

        <p>“${r.slogan}”</p>
        <button class="copy-mini" data-copy="slogan">复制</button>
      </div>

      <div class="dims">
        <p class="dims-title">你的七维分布</p>
        ${dimRows}
      </div>
    </div>

    <div class="res-block" style="--acc:${r.acc}">
      <h3>为什么是你</h3>
      ${r.why.map(t=>`<p>${t}</p>`).join('')}
    </div>

    <div class="res-block" style="--acc:${r.acc}">
      <h3>隐藏特质 & 小彩蛋</h3>
      <p>${r.hidden}</p>
      <div class="easter"><b>彩蛋 ·</b> ${r.easter}</div>
      <p class="scene">${r.scene}</p>
    </div>

    <div class="res-block" style="--acc:${r.acc}">
      <h3>你在小城的位置</h3>
      <p>${r.position}</p>
    </div>

    <div class="res-actions">
      <button class="btn main" id="saveBtn">保存结果卡片</button>
      <button class="btn ghost" id="retryBtn">再测一次</button>
    </div>
    <div class="res-actions" style="margin-top:10px">
      <button class="btn ghost" id="shareBtn">复制分享文案</button>
    </div>
    <p class="share-hint">卡片会存成一张图，直接发朋友圈或群里问一句“你是哪个”。</p>
  `;

  showView('result');

  $('#resStage [data-copy="slogan"]').addEventListener('click',(e)=>copyText(r.slogan, e.currentTarget));
  $('#retryBtn').addEventListener('click',()=>{
    state.idx = 0;
    state.answers = new Array(QUESTIONS.length).fill(null);
    state.locked = false;
    showView('quiz');
    renderQuestion();
  });
  $('#shareBtn').addEventListener('click',(e)=>copyText(shareText, e.currentTarget));
  $('#saveBtn').addEventListener('click',()=>saveCard(r));
}

// ===== 一键生成结果卡片 =====
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function wrapText(ctx, text, maxW, x, y, lineH, maxLines){
  const chars = Array.from(text);
  let line = '', lines = [];
  for(let i=0;i<chars.length;i++){
    const test = line + chars[i];
    if(ctx.measureText(test).width > maxW && line){
      lines.push(line); line = chars[i];
    }else{ line = test; }
  }
  if(line) lines.push(line);
  if(maxLines && lines.length > maxLines){
    lines = lines.slice(0, maxLines);
    lines[maxLines-1] = lines[maxLines-1].slice(0, -1) + '…';
  }
  lines.forEach((l,i)=> ctx.fillText(l, x, y + i*lineH));
  return lines.length;
}

function saveCard(r){
  const W = 1080, H = 1350;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext('2d');
  const serif = '"Noto Serif SC","Songti SC",serif';
  const sans = '"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif';

  // 底色
  const g = ctx.createLinearGradient(0,0,W*0.7,H);
  g.addColorStop(0,'#16283A'); g.addColorStop(.55,'#0E1A27'); g.addColorStop(1,'#0A141D');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

  // 光晕
  const glow = ctx.createRadialGradient(W*0.82,H*0.12,0,W*0.82,H*0.12,W*0.9);
  glow.addColorStop(0, hexA(r.acc,.22)); glow.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

  // 雪点
  for(let i=0;i<110;i++){
    const x = Math.random()*W, y = Math.random()*H, rr = Math.random()*2.4+0.6;
    ctx.fillStyle = `rgba(255,255,255,${Math.random()*0.5+0.14})`;
    ctx.beginPath(); ctx.arc(x,y,rr,0,Math.PI*2); ctx.fill();
  }

  // 顶部标签
  ctx.fillStyle = 'rgba(159,194,212,.85)';
  ctx.font = `500 26px ${sans}`;
  ctx.fillText('SMALL TOWN REMEDY · 人格小票', 78, 108);

  // 角色名
  ctx.save();
  ctx.shadowColor = hexA(r.acc,.55); ctx.shadowBlur = 34;
  ctx.fillStyle = r.acc; ctx.font = `700 92px ${serif}`;
  ctx.fillText(r.name, 78, 236);
  ctx.restore();

  // 身份 + 演员
  ctx.fillStyle = 'rgba(210,228,238,.92)'; ctx.font = `400 34px ${sans}`;
  ctx.fillText(r.tag, 78, 306);
  ctx.fillStyle = 'rgba(138,163,179,.95)'; ctx.font = `300 28px ${sans}`;
  ctx.fillText(r.actor, 78, 352);

  // slogan 卡
  ctx.fillStyle = 'rgba(255,255,255,.06)';
  roundRect(ctx, 64, 398, W-128, 168, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.14)'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#FFEFCF'; ctx.font = `500 36px ${serif}`;
  wrapText(ctx, '“' + r.slogan + '”', W-190, 100, 462, 54, 2);

  // 分隔
  const line = ctx.createLinearGradient(78,0,W-78,0);
  line.addColorStop(0,'rgba(255,255,255,.22)'); line.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = line; ctx.fillRect(78, 618, W-156, 2);

  // 为什么
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = `500 24px ${sans}`;
  ctx.fillText('为 什 么 是 你', 78, 682);
  ctx.fillStyle = 'rgba(238,246,250,.94)'; ctx.font = `300 33px ${sans}`;
  let y = 734;
  const n1 = wrapText(ctx, r.why[0], W-156, 78, y, 56, 2);
  y += n1*56 + 44;

  // 隐藏特质
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.font = `500 24px ${sans}`;
  ctx.fillText('隐 藏 特 质', 78, y);
  ctx.fillStyle = 'rgba(214,230,238,.9)'; ctx.font = `300 31px ${sans}`;
  const n2 = wrapText(ctx, r.hidden, W-156, 78, y+52, 52, 3);

  // 底部
  ctx.fillStyle = 'rgba(255,255,255,.07)';
  roundRect(ctx, 64, H-210, W-128, 132, 20); ctx.fill();
  ctx.fillStyle = 'rgba(255,239,207,.95)'; ctx.font = `500 32px ${serif}`;
  ctx.fillText('测一测｜你是《小城良方》里的谁', 96, H-150);
  ctx.fillStyle = 'rgba(146,170,185,.95)'; ctx.font = `300 24px ${sans}`;
  ctx.fillText('30 道日常小题 · 凭第一反应 · 你也来对一下', 96, H-108);

  canvas.toBlob((blob)=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `小城良方-${r.name}-结果卡片.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    toast('卡片已保存，长按或直接在相册里找到它');
  }, 'image/png');
}

function hexA(hex, a){
  const h = hex.replace('#','');
  const full = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
  const r = parseInt(full.slice(0,2),16), g = parseInt(full.slice(2,4),16), b = parseInt(full.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

// ===== 复制 / 提示 =====
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>t.classList.remove('show'), 2100);
}

function copyText(text, btn){
  const done = ()=>{
    toast('已复制，去粘给朋友吧');
    if(btn){ const old = btn.textContent; btn.textContent = '已复制'; setTimeout(()=>{ btn.textContent = old; }, 1600); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else{
    fallbackCopy(text, done);
  }
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('长按选中文字复制即可'); }
  document.body.removeChild(ta);
}

// ===== 飘雪 =====
(function makeSnow(){
  const box = $('#snow');
  const count = window.innerWidth < 600 ? 22 : 40;
  let html = '';
  for(let i=0;i<count;i++){
    const size = (Math.random()*3.2+1.2).toFixed(1);
    html += `<span class="flake" style="left:${(Math.random()*100).toFixed(1)}%;width:${size}px;height:${size}px;
      animation-duration:${(Math.random()*10+9).toFixed(1)}s;animation-delay:-${(Math.random()*18).toFixed(1)}s;
      --dx:${(Math.random()*40-20).toFixed(0)}px;opacity:${(Math.random()*0.5+0.3).toFixed(2)}"></span>`;
  }
  box.innerHTML = html;
})();

// 首次进入先铺好题目
renderQuestion();
</script>
